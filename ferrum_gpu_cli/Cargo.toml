[package]
name = "ferrum_gpu_cli"
description = "Command line for ferrum-gpu: train, generate, eval, run-gguf, finetune-gguf, info."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferrum_gguf = { path = "../ferrum_gguf" }
ferrum_model = { path = "../ferrum_model" }
ferrum_ref = { path = "../ferrum_ref" }
ferrum_tok = { path = "../ferrum_tok" }
ferrum_wgpu = { path = "../ferrum_wgpu" }
# ponytail: reuses the GUI crate's engine, backends and byte tokenizer instead of a second copy;
# move them to a shared crate if a third consumer appears.
ferrum_gpu_gui = { path = "../ferrum_gpu_gui" }

[[bin]]
name = "ferrum-gpu"
path = "src/main.rs"
