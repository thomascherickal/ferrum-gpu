[package]
name = "ferrum_gpu_cli"
description = "The ferrum-gpu command line: a thin main over ferrum_gpu_core::commands."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferrum_gpu_core = { path = "../ferrum_gpu_core" }

[dev-dependencies]
ferrum_gguf = { path = "../ferrum_gguf" }
ferrum_model = { path = "../ferrum_model" }
ferrum_ref = { path = "../ferrum_ref" }
ferrum_tok = { path = "../ferrum_tok" }
ferrum_wgpu = { path = "../ferrum_wgpu" }

[[bin]]
name = "ferrum-gpu"
path = "src/main.rs"
