[package]
name = "ferrum_gpu_server"
description = "JSON server for ferrum-gpu: /health, /v1/info, /v1/generate, /v1/loglikelihood, /v1/loglikelihood_rolling."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ferrum_gpu_core = { path = "../ferrum_gpu_core" }

[dev-dependencies]
ferrum_gguf = { path = "../ferrum_gguf" }
ferrum_model = { path = "../ferrum_model" }
ferrum_ref = { path = "../ferrum_ref" }
ferrum_tok = { path = "../ferrum_tok" }
ferrum_wgpu = { path = "../ferrum_wgpu" }

[[bin]]
name = "ferrum-gpu-server"
path = "src/main.rs"
