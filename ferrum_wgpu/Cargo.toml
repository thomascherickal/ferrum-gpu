[package]
name = "ferrum_wgpu"
description = "wgpu/WGSL engine for small causal Transformers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = "1.25.2"
wgpu = "30.0.1"
ferrum_ref = { path = "../ferrum_ref" }
ferrum_gguf = { path = "../ferrum_gguf" }

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
ferrum_model = { path = "../ferrum_model" }

[[bench]]
name    = "matmul"
harness = false

[[bench]]
name    = "decode"
harness = false

[[bench]]
name    = "train"
harness = false

[[bench]]
name    = "llama"
harness = false

[[bench]]
name    = "profile_train"
harness = false
