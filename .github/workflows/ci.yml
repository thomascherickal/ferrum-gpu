name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required gate. No GPU on the hosted runner: the suite passes with GPU tests skipping, and the
  # Mesa software Vulkan driver (lavapipe) gives one real adapter row (docs/DEVICES.md).
  test:
    name: Lint, deny, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Independence guard and the context-script tests live in the `tests` crate.
      - run: cargo test -p integration_tests --locked
      - run: cargo test --workspace --locked
      - name: Device row (lavapipe)
        run: FERRUM_GPU_ADAPTER=llvmpipe cargo test --release -p ferrum_wgpu --locked

  # Not required (fail-fast off): macOS (Metal) and Windows (DX12) build and run the suite. Hosted
  # runners have no hardware GPU, so a green job is not a device row; it shows the build and the
  # no-GPU path work. Rows for Apple, AMD and Windows hardware need a machine that has one.
  portable:
    name: Portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # which adapter (if any) the hosted runner offers, so a failure can be read against it
      - name: Adapters
        run: cargo run -q -p ferrum_gpu_cli --locked -- info --device cpu
        continue-on-error: true
      # --no-fail-fast: see every failing test, not just the first binary's. One test thread:
      # concurrent GPU device opens hang or crash some drivers (HANDOFF.md). The step timeout turns
      # a hung test into a failure instead of an hour of runner time.
      - name: "Tests (Windows, whatever adapter the runner has)"
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads 1
        timeout-minutes: 25
      # macOS: the hosted runner's paravirtual Apple GPU hung a test run for 40+ minutes (the step
      # timeout did not even stop it) and gave GPU/CPU loss curves that disagree, so the build and
      # CPU paths are tested with no adapter. (A separate GPU step was tried and removed: it ran
      # past its timeout-minutes and had to be cancelled by hand. See docs/DEVICES.md.)
      - name: "Tests (macOS, no GPU adapter)"
        if: runner.os == 'macOS'
        env:
          FERRUM_GPU_ADAPTER: no-such-adapter
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads 1
        timeout-minutes: 25
